<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 背景 -->
  <rect width="200" height="200" fill="#f5f5f5" rx="10" ry="10"/>
  
  <!-- 图表容器 -->
  <rect x="20" y="40" width="160" height="100" fill="#ffffff" rx="5" ry="5" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- 空状态图标 - 条形图轮廓 -->
  <g transform="translate(30, 30)">
    <!-- 水平轴 -->
    <line x1="0" y1="110" x2="140" y2="110" stroke="#9e9e9e" stroke-width="1"/>
    <!-- 垂直轴 -->
    <line x1="0" y1="0" x2="0" y2="110" stroke="#9e9e9e" stroke-width="1"/>
    
    <!-- 虚线表示空状态的条形 -->
    <line x1="10" y1="80" x2="10" y2="110" stroke="#e0e0e0" stroke-width="6" stroke-dasharray="2,2"/>
    <line x1="30" y1="60" x2="30" y2="110" stroke="#e0e0e0" stroke-width="6" stroke-dasharray="2,2"/>
    <line x1="50" y1="90" x2="50" y2="110" stroke="#e0e0e0" stroke-width="6" stroke-dasharray="2,2"/>
    <line x1="70" y1="40" x2="70" y2="110" stroke="#e0e0e0" stroke-width="6" stroke-dasharray="2,2"/>
    <line x1="90" y1="70" x2="90" y2="110" stroke="#e0e0e0" stroke-width="6" stroke-dasharray="2,2"/>
    <line x1="110" y1="50" x2="110" y2="110" stroke="#e0e0e0" stroke-width="6" stroke-dasharray="2,2"/>
    <line x1="130" y1="85" x2="130" y2="110" stroke="#e0e0e0" stroke-width="6" stroke-dasharray="2,2"/>
  </g>
  
  <!-- 文字说明 -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="14" fill="#9e9e9e" text-anchor="middle">暂无统计数据</text>
</svg>